name: school_core
description: >-
  Infrastructure partagée des applications mobiles School Managing (enseignant,
  parent, gardien, personnel) : client HTTP de l'API Django, erreurs, sessions
  et jetons, temps réel, thème et composants. Aucune règle métier ici : le
  backend reste la source de vérité.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  web_socket_channel: ^3.0.3
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2
  provider: ^6.1.5
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Android side (Kotlin): the Android 17 local-network permission, shared by the four apps.
  plugin:
    platforms:
      android:
        package: cm.schoolmanaging.school_core
        pluginClass: SchoolCorePlugin
