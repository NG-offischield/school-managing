# Public DEMO of ISBREE on Render's FREE plan (ADR 0033, docs/deploiement-demo.md).
# Fictitious data only, never the development database, never real families.
# PostgreSQL is NOT hosted here (Render's free Postgres expires after 30 days): it is a
# separate Neon free project, whose connection values are entered by hand (sync: false).
# Secrets are generated by Render or entered in its dashboard: none is written in this file.
services:
  # --- Django API (ASGI) --------------------------------------------------------------------
  - type: web
    name: isbree-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Migrations + idempotent demo seed (fictitious accounts and contents), then the ASGI server.
    dockerCommand: sh -c "python manage.py migrate --noinput && python manage.py seed_isbree --demo && daphne -b 0.0.0.0 -p $PORT config.asgi:application"
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.demo
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_SSLMODE
        value: require
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: isbree-redis
          property: connectionString
      - key: WEB_BFF_TOKEN
        generateValue: true
      - key: ISBREE_PORTAL_URL
        sync: false
      - key: ISBREE_DEMO_PASSWORD
        sync: false
      - key: ISBREE_ADMIN_PASSWORD
        sync: false
      - key: ISBREE_CONTACT_EMAIL
        sync: false

  # --- Redis-compatible store (cache, rate limits, channel layer): in memory, may be emptied ----
  - type: keyvalue
    name: isbree-redis
    plan: free
    ipAllowList: [] # internal connections only

  # --- Espace ISBREE (portal) -------------------------------------------------------------------
  - type: web
    name: isbree-portal
    runtime: node
    plan: free
    rootDir: web/isbree-portal
    buildCommand: npm ci && npm run build
    startCommand: npx next start -p $PORT
    envVars:
      - key: ISBREE_SCHOOL_CODE
        value: ISBREE
      - key: ISBREE_DEMO_MODE
        value: "true"
      - key: DJANGO_INTERNAL_API_URL
        sync: false
      - key: ISBREE_PUBLIC_URL
        sync: false
      - key: ISBREE_PORTAL_URL
        sync: false
      - key: WEB_BFF_TOKEN
        fromService:
          type: web
          name: isbree-api
          envVarKey: WEB_BFF_TOKEN
      - key: PORTAL_SESSION_SECRET
        generateValue: true
      - key: ISBREE_DEMO_SHARED_PASSWORD
        sync: false
      - key: ISBREE_TRUSTED_PROXY_HOPS
        value: "1"

  # --- Public site ---------------------------------------------------------------------------------
  - type: web
    name: isbree-public
    runtime: node
    plan: free
    rootDir: web/isbree-public
    buildCommand: npm ci && npm run build
    startCommand: npx next start -p $PORT
    envVars:
      - key: ISBREE_SCHOOL_CODE
        value: ISBREE
      - key: ISBREE_DEMO_MODE
        value: "true"
      - key: DJANGO_INTERNAL_API_URL
        sync: false
      - key: ISBREE_PUBLIC_URL
        sync: false
      - key: ISBREE_PORTAL_URL
        sync: false
      - key: WEB_BFF_TOKEN
        fromService:
          type: web
          name: isbree-api
          envVarKey: WEB_BFF_TOKEN
      - key: ISBREE_TRUSTED_PROXY_HOPS
        value: "1"
